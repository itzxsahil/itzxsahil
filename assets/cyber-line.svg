<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 16" width="100%" height="16">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0" />
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#60A5FA" stop-opacity="1" />
      <stop offset="75%" stop-color="#818CF8" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="trackGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0" />
      <stop offset="20%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="80%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Track Line -->
  <line x1="50" y1="8" x2="850" y2="8" stroke="url(#trackGlow)" stroke-width="1" />

  <!-- Core Neon Cyan/Blue Line -->
  <line x1="120" y1="8" x2="780" y2="8" stroke="url(#cyberGlow)" stroke-width="2.5" stroke-linecap="round" />

  <!-- Center Hex/Diamond Accent Node -->
  <g transform="translate(450, 8)">
    <circle cx="0" cy="0" r="7" fill="#38BDF8" opacity="0.25" />
    <circle cx="0" cy="0" r="4.5" fill="#1E293B" stroke="#38BDF8" stroke-width="1.5" />
    <circle cx="0" cy="0" r="2" fill="#60A5FA" />
  </g>

  <!-- Flanking Sub-Nodes -->
  <circle cx="280" cy="8" r="2" fill="#38BDF8" opacity="0.6" />
  <circle cx="620" cy="8" r="2" fill="#818CF8" opacity="0.6" />
</svg>