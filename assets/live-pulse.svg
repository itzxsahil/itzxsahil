<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 150" width="100%" height="150">
  <defs>
    <linearGradient id="pulseBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0E14" />
      <stop offset="100%" stop-color="#161B22" />
    </linearGradient>
    <style>
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }
      .beacon {
        animation: blink 1.8s infinite ease-in-out;
      }
    </style>
  </defs>

  <rect width="900" height="150" rx="12" fill="url(#pulseBg)" stroke="#30363D" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <circle cx="25" cy="25" r="5" fill="#22C55E" class="beacon" />
  <text x="38" y="29" fill="#22C55E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="bold">ACTIVE DEVELOPER PULSE • SYSTEM OPERATIONAL</text>
  
  <rect x="740" y="15" width="135" height="20" rx="10" fill="#1C2128" stroke="#30363D" stroke-width="1" />
  <text x="807" y="29" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="10" font-weight="bold" text-anchor="middle">STATUS: DEPLOYING</text>
  <line x1="20" y1="42" x2="880" y2="42" stroke="#21262D" stroke-width="1" />

  <!-- Telemetry Row 1 -->
  <g transform="translate(25, 70)">
    <text x="0" y="0" fill="#38BDF8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">&gt; CURRENT FOCUS:</text>
    <text x="145" y="0" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">High-Throughput Cloud Automation • Sandboxed noVNC Desktops</text>
  </g>

  <!-- Telemetry Row 2 -->
  <g transform="translate(25, 96)">
    <text x="0" y="0" fill="#818CF8" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">&gt; INFRASTRUCTURE:</text>
    <text x="145" y="0" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13">Multi-Container Docker Stacks • WebSocket Relays • Zero-Leak Sandboxes</text>
  </g>

  <!-- Telemetry Row 3 -->
  <g transform="translate(25, 122)">
    <text x="0" y="0" fill="#34D399" font-family="'Fira Code', monospace" font-size="13" font-weight="bold">&gt; ACTIVITY VELOCITY:</text>
    <text x="145" y="0" fill="#94A3B8" font-family="'Fira Code', monospace" font-size="12">16 Active Repositories • Continuous GitHub Workflows • Verified Achievements</text>
  </g>
</svg>